<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaStore — Production E-Commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #151D2E;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #2563EB;
      --success: #10B981;
      --danger: #EF4444;
      --text: #F8FAFC;
      --text-dim: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(13, 19, 33, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 19px;
      font-weight: 800;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .nav-links a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover {
      color: #FFF;
    }
    .cart-badge {
      background: var(--accent);
      color: #FFF;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
    }
    .container {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .order-summary {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--text-dim);
    }
    .summary-row.total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 16px;
      font-weight: 700;
      color: #FFF;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-control {
      width: 100%;
      background: #060910;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: #FFF;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .btn-action-row {
      display: flex;
      gap: 14px;
      margin-top: 24px;
    }
    .btn {
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      flex: 2;
      background: #2563EB;
      color: #FFF;
      border: 1px solid #1D4ED8;
    }
    .btn-primary:hover {
      background: #1D4ED8;
    }
    .btn-secondary {
      flex: 1;
      background: #1E293B;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: #334155;
      color: #FFF;
    }
    /* Floating Bug Report Button (Like real apps) */
    .floating-report-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #FFF;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      z-index: 999;
    }
    .floating-report-btn:hover {
      background: #334155;
      border-color: #2563EB;
    }
    .toast {
      position: fixed;
      bottom: 80px;
      right: 24px;
      background: #1E293B;
      color: #FFF;
      padding: 14px 22px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <!-- Silent Background Telemetry SDK (Zero-Trust) -->
  <script src="/bugtwin-sdk.js"></script>

  <header class="top-bar">
    <div class="logo">
      <span>🛍️</span> NovaStore
    </div>
    <nav class="nav-links">
      <a href="#">Products</a>
      <a href="#">Subscriptions</a>
      <a href="#" id="navReportLink">Report an Issue</a>
      <span class="cart-badge">Cart: 1</span>
    </nav>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-title">
        <span>Payment & Checkout Gateway</span>
        <span style="font-size: 12px; color: var(--text-dim); font-weight: 500;">Order #ord_99812</span>
      </div>

      <div class="order-summary">
        <div class="summary-row">
          <span>Item</span>
          <span>Enterprise Developer Hardware Suite</span>
        </div>
        <div class="summary-row">
          <span>Customer ID</span>
          <span>cust_prod_99812</span>
        </div>
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="amountDisplay">50,000 JPY</span>
        </div>
        <div class="summary-row total">
          <span>Total Billed Amount</span>
          <span id="totalDisplay">50,000 JPY</span>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Currency</label>
          <select id="currencySelect" class="form-control">
            <option value="JPY" selected>JPY (Japanese Yen)</option>
            <option value="USD">USD (US Dollar)</option>
            <option value="EUR">EUR (Euro)</option>
          </select>
        </div>
        <div class="form-group">
          <label>Customer Email</label>
          <input type="text" id="custEmail" class="form-control" value="david.lee@enterprise.co">
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Credit Card Number</label>
          <input type="text" id="cardNumber" class="form-control" value="4111-2222-3333-4444">
        </div>
        <div class="form-group">
          <label>API Key / Auth Token</label>
          <input type="text" id="apiToken" class="form-control" value="Bearer secret_jwt_prod_eyJhGciOi...">
        </div>
      </div>

      <div class="btn-action-row">
        <button id="btnCheckoutCrash" class="btn btn-primary">
          <span>💳</span> Pay 50,000 JPY
        </button>
        <button id="btnReportOnly" class="btn btn-secondary">
          <span>🚨</span> Report Issue
        </button>
      </div>
    </div>
  </div>

  <!-- Standard Floating "Report Bug" Widget (like Sentry/Intercom in real apps) -->
  <button class="floating-report-btn" id="floatingReportBtn">
    <span>💬</span> Report a Bug
  </button>

  <div id="toast" class="toast"></div>

  <script>
    const btnCheckout = document.getElementById('btnCheckoutCrash');
    const btnReport = document.getElementById('btnReportOnly');
    const navReportLink = document.getElementById('navReportLink');
    const floatingReportBtn = document.getElementById('floatingReportBtn');
    const currencySelect = document.getElementById('currencySelect');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    currencySelect.addEventListener('change', (e) => {
      const curr = e.target.value;
      const label = curr === 'JPY' ? '50,000 JPY' : curr === 'USD' ? '$500 USD' : '€450 EUR';
      document.getElementById('amountDisplay').textContent = label;
      document.getElementById('totalDisplay').textContent = label;
      btnCheckout.innerHTML = `<span>💳</span> Pay ${label}`;
    });

    // 💥 Real-time Bug Trigger & Reporting
    async function triggerRealTimeBug(isDirectReport = false) {
      const currency = currencySelect.value;

      try {
        if (currency === 'JPY' || isDirectReport) {
          // Simulate the 3rd party forex API response structure for JPY (missing conversion)
          const forexResponse = {
            base: 'JPY',
            target: 'USD',
            data: { rawRate: 0.0067 } // Missing 'conversion' object
          };

          // THIS THROWS THE REAL JAVASCRIPT TYPEERROR:
          const rate = forexResponse.data.conversion.rate;
          console.log("Calculated:", rate * 50000);
          showToast(`✔ Order processed cleanly in ${currency}!`);
        } else {
          showToast(`✔ Order processed cleanly in ${currency}!`);
        }
      } catch (err) {
        // Transparently dispatch sanitized trace via background SDK
        if (window.__bugtwin) {
          window.__bugtwin.sendTrace({
            name: err.name,
            message: err.message,
            stack: err.stack,
            currency: currency,
            customerEmail: document.getElementById('custEmail').value,
            cardNumber: document.getElementById('cardNumber').value,
            apiToken: document.getElementById('apiToken').value,
            action: isDirectReport ? 'user_report_bug' : 'checkout_payment'
          });
        }

        // Show realistic, standard consumer error notification
        showToast('⚠️ Something went wrong during checkout. An automated error report has been logged.');
      }
    }

    btnCheckout.addEventListener('click', () => triggerRealTimeBug(false));
    btnReport.addEventListener('click', () => triggerRealTimeBug(true));
    floatingReportBtn.addEventListener('click', () => triggerRealTimeBug(true));
    navReportLink.addEventListener('click', (e) => {
      e.preventDefault();
      triggerRealTimeBug(true);
    });
  </script>
</body>
</html>
